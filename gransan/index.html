<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153b32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Mi mapa · GranSan</title>
</head>
<body>
  <header><div class="brand"><span class="brand-icon" aria-hidden="true">⌖</span><div><strong>Mi mapa · GranSan</strong></div></div></header>
  <main>
    <form id="search-form" role="search"><label for="query">Número de local o nombre de tienda</label><div class="search-row"><input id="query" type="search" placeholder="Ej. 1001 o Azierto" autocomplete="off" enterkeyhint="search" disabled><button id="search-button" class="primary" disabled>Ubicar</button><button id="save-search-local" type="button" aria-label="Guardar local seleccionado" title="Guardar local" disabled>+</button></div></form>
    <p id="status" role="status" aria-live="polite">Cargando los planos y locales…</p>
    <section id="results" aria-label="Resultados de búsqueda" hidden></section>
    <details class="saved" open><summary>Mis locales guardados <span id="saved-count"></span></summary><p id="saved-status" role="status"></p><div id="saved-list"></div></details>
    <section class="map-card" aria-label="Plano del centro comercial">
      <div class="map-top"><div class="floors" role="group" aria-label="Seleccionar piso"><button type="button" data-floor="1" aria-pressed="true">Piso 1</button><button type="button" data-floor="2" aria-pressed="false">Piso 2</button><button type="button" data-floor="3" aria-pressed="false">Piso 3</button></div><div class="zoom-controls"><button id="zoom-out" type="button" aria-label="Alejar mapa">−</button><button id="fit" type="button">Ajustar</button><button id="zoom-in" type="button" aria-label="Acercar mapa">+</button></div></div>

      <div id="viewport" tabindex="0" aria-label="Mapa desplazable"><div id="canvas"><img id="map" alt="Plano del piso 1" draggable="false"><div id="map-locals"></div><div id="marker" hidden><span id="marker-label"></span><button id="marker-save" type="button" aria-label="Guardar local seleccionado">+</button><i></i></div></div></div>
    </section>
    <section id="detail" class="detail" hidden aria-label="Local seleccionado"></section>
    <footer><p id="offline-status" hidden></p><button id="install" type="button" class="primary">Descargar app</button><p id="install-status" role="status"></p></footer>
  </main>
  <noscript>Activa JavaScript en tu navegador para buscar locales.</noscript>
  <script type="module" src="app.mjs"></script>
</body>
</html>
